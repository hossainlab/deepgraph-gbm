# DeepGraph-GBM default configuration
seed: 42

paths:
  data_root: data                 # raw downloads
  processed: data/processed       # per-section AnnData + graphs
  checkpoints: models
  figures: results/figures

data:
  n_hvgs: 3000
  knn_k: 6
  min_genes_per_spot: 200
  # patients used for training/val/test (patient-level split, FFPE-stratified)
  splits_file: configs/splits.json

model:
  encoder: graphsage
  hidden_dims: [256, 256, 128]
  dropout: 0.3
  aggr: mean

training:
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 200
  patience: 40
  batch_mode: full_graph        # one section per step
  loss_weights:
    niche: 1.0
    mes: 0.5
    survival: 0.5
  class_weighted_ce: true
  # boost rare-but-critical classes beyond balanced (immune_hot is 8.8% of spots)
  class_boost: {1: 3.0, 3: 1.5}   # immune_hot x3, necrotic x1.5

evaluation:
  n_seeds: 3
  seeds: [42, 7, 123]
