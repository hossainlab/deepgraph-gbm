[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepgraph-gbm"
version = "0.1.0"
description = "Graph Neural Network for predicting immunosuppressive spatial niches in glioblastoma from Visium spatial transcriptomics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jubayer Hossain" }]
keywords = ["glioblastoma", "spatial transcriptomics", "graph neural network", "Visium", "tumor microenvironment"]
dependencies = [
    "torch>=2.1",
    "torch_geometric>=2.5",
    "scanpy>=1.10",
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lifelines>=0.29",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
